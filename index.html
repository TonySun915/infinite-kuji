<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="無限賞">
<meta name="theme-color" content="#7856eb">
<title>無限賞抽獎</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
  :root{--cy:#c9f6f5;--ink:#1b1630;--pink:#ff3d8b;--gold:#ffc83d;--purple:#6b5cff;--line:#e3e3ee;--bar:#8c8cff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--cy);font-family:system-ui,"Microsoft JhengHei",sans-serif;color:var(--ink);min-height:100vh}
  #app{max-width:430px;margin:0 auto;background:#fff;min-height:100vh;position:relative;padding-bottom:110px;box-shadow:0 0 40px #0002}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  /* 頂部 */
  .hero{background:linear-gradient(#9fd8ff,#e9d9ff 70%,#fff);padding:10px 10px 8px;position:relative}
  .icons{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}
  .icons button{background:#fffd;border:1.5px solid var(--ink);border-radius:20px;padding:4px 10px;font-size:13px;font-weight:700}
  #title{margin:10px 0 0;background:#fffc;border-radius:18px;padding:6px 12px;font-size:14px;font-weight:700;display:inline-block;max-width:100%;transition:opacity .3s}
  /* 榜首 */
  .rank{margin-top:56px;display:flex;align-items:stretch;background:linear-gradient(90deg,#8d0f5a,#d8236f);color:#fff;border-radius:6px 0 0 6px;position:relative;min-height:62px}
  .rank .lbl{position:absolute;left:0;top:-30px;font-size:24px;font-weight:900;font-style:italic;-webkit-text-stroke:1px #fff;color:var(--ink);text-shadow:2px 2px 0 var(--pink)}
  .rank .timer{position:absolute;left:150px;top:-22px;background:#6a0a40;color:#fff;border-radius:14px;padding:2px 10px;font-size:13px;font-weight:700}
  .rank .who{display:flex;align-items:center;gap:8px;padding:8px 10px;flex:1}
  .av{width:32px;height:32px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:18px;border:2px solid #fff}
  .rank .cnt{font-size:12px;font-weight:700}
  .rank .rw{background:#ff5fa3;padding:6px 8px;text-align:center;font-size:12px;font-weight:900;display:grid;align-content:center;min-width:70px}
  .sold{position:absolute;right:6px;bottom:-26px;color:var(--ink);background:#fffe;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:700}
  /* 館皇 */
  .king{margin:34px 10px 10px;background:linear-gradient(#bfeee8,#6fe7e0);border:3px solid #444;border-radius:10px;padding:10px;display:flex;align-items:center;gap:10px}
  .king .av{width:44px;height:44px;font-size:26px}
  .king b{font-size:18px}
  .king .r{margin-left:auto;text-align:right;font-size:13px}
  .king .r small{display:block;color:#456;font-size:11px}
  /* tabs */
  .tabs{display:flex;gap:8px;padding:0 10px;margin-top:8px}
  .tabs button{padding:6px 14px;border-radius:16px;background:#eee;font-weight:800;font-size:15px}
  .tabs button.on{background:var(--ink);color:#fff}
  .pity{margin:10px;background:var(--bar);color:#fff;text-align:center;font-weight:800;border-radius:4px;padding:5px;position:relative;overflow:hidden}
  .pity i{position:absolute;inset:0 auto 0 0;background:#0003;width:0}
  .pity span{position:relative}
  .pity b{font-size:20px;color:#fff;background:var(--ink);padding:0 6px;border-radius:4px;margin:0 3px}
  .sec{display:flex;justify-content:space-between;align-items:center;margin:12px 10px 6px}
  .sec h3{margin:0;background:#e3e3f5;font-size:20px;padding:2px 12px;border-radius:4px;font-style:italic;-webkit-text-stroke:.5px var(--ink)}
  .sec span{background:#eeeef7;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:700;color:#556}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 10px}
  .it{min-width:0;text-align:left}
  .it .img{aspect-ratio:1;background:#eeeef2;border-radius:6px;display:grid;place-items:center;font-size:34px}
  .it .nm{font-size:10px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it .pr{font-size:11px;font-weight:800}
  .it.got .img{outline:2px solid var(--gold)}
  /* 底部 */
  .dock{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#fff0,#fff 40%)}
  .dock button{background:linear-gradient(#444,#111);color:#fff;border:2px solid #bbb;border-radius:30px;padding:6px 0;font-weight:900;line-height:1.2}
  .dock button small{display:block;color:#5ff;font-size:14px}
  .dock button:disabled{opacity:.5}
  /* 清單 */
  .list{padding:8px 10px;display:flex;flex-direction:column;gap:6px;font-size:14px}
  .list .row{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;background:#f5f5fa;border-radius:6px}
  .list .row.god{background:#fff3c4}
  .tag{font-size:11px;background:var(--ink);color:#fff;border-radius:4px;padding:1px 6px;margin-right:4px}
  .tag.god{background:var(--gold);color:#241a00}
  .muted{color:#778;font-size:12px}
  /* modal */
  .mask{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:410px;width:100%;max-height:86vh;overflow:auto;padding:16px}
  .modal h2{margin:0 0 10px;font-size:18px}
  .modal .close{width:100%;margin-top:12px;background:var(--ink);color:#fff;border-radius:12px;padding:10px;font-weight:800}
  .rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .rc{border-radius:8px;background:#f1f1f6;text-align:center;padding:8px 4px;font-size:11px}
  .rc{position:relative}
  .rc .tier{position:absolute;left:0;top:0;background:var(--ink);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px 0 8px 0}
  .rc .tier.god{background:var(--gold);color:#241a00}
  .rgrid.one{grid-template-columns:1fr;max-width:220px;margin:0 auto}
  .rgrid.one .rc{padding:18px 8px;font-size:14px}
  .rgrid.one .rc .e img{width:140px;height:140px}
  .rgrid.one .rc .e{font-size:80px}
  .whead{display:flex;justify-content:space-between;align-items:center;background:#e3e3f5;border-radius:6px;padding:2px 8px 2px 0;margin:12px 0 6px}
  .whead h3{margin:0;background:var(--ink);color:#fff;font-style:italic;font-size:18px;padding:2px 12px;border-radius:6px 14px 14px 6px;text-shadow:2px 2px 0 var(--pink)}
  .whead h3.god{background:linear-gradient(90deg,#4b2a99,#c72f8a)}
  .wtog{font-size:13px;font-weight:700;color:#445}
  .wrow{position:relative;display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:end;background:#f1f2f7;border-radius:12px;padding:12px;margin-bottom:6px}
  .av2{width:40px;height:40px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:22px;align-self:center}
  .wname{font-weight:800;font-size:15px}
  .wtime{font-size:11px;color:#8a8aa0;white-space:nowrap}
  .wit{font-size:13px;font-weight:700;text-align:right;max-width:140px}
  .wbadge{position:absolute;right:0;top:0;background:#ffab40;color:#fff;font-size:12px;font-weight:800;padding:1px 12px;border-radius:0 12px 0 12px}
  .king{cursor:pointer}
  .win{position:relative;background:#f5f5fa;border-radius:10px;padding:10px 12px;display:grid;gap:2px}
  .win.god{background:#fff3c4}
  .win .wn{font-size:13px;font-weight:700;text-align:right;margin-top:-18px;max-width:60%;margin-left:auto}
  .win .badge{position:absolute;right:0;top:0;background:#cfcfd8;border-radius:0 10px 0 10px;padding:1px 10px;font-size:12px;font-weight:700}
  .it{cursor:pointer}
  .big{height:200px;display:grid;place-items:center;font-size:90px}
  .big img{width:100%;height:100%;object-fit:contain}
  .row2{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
  .row2 b{text-align:right}
  .rc .e{font-size:30px}
  .rc .e img{width:56px;height:56px;object-fit:contain;border-radius:6px}
  .it .img img{width:100%;height:100%;object-fit:contain;border-radius:6px}
  .rc.god{background:linear-gradient(#fff3c4,#ffd86b);box-shadow:0 0 12px var(--gold);animation:pop .5s}
  .spinbox{text-align:center;font-size:64px;animation:shake .15s infinite}
  @keyframes shake{0%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}100%{transform:rotate(-6deg)}}
  @keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
  .sum{margin:10px 0 0;text-align:center;font-weight:800}
  table{width:100%;border-collapse:collapse;font-size:12px}
  td,th{padding:3px;text-align:left}
  input{font:inherit;width:100%;padding:5px 6px;border:1px solid #ccd;border-radius:6px}
  td input[type=number]{width:80px}
  label.f{display:grid;gap:3px;font-size:12px;color:#556;margin-bottom:8px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn2{background:#eee;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700}

  /* ---- 版面仿參考圖 ---- */
  .hero{background:linear-gradient(#8fc9ff,#c9d4ff 55%,#e8dcff);padding:8px 8px 0;min-height:238px;display:flex;flex-direction:column;overflow:hidden}
  .topbar{display:flex;align-items:center;gap:6px;position:relative;z-index:2}
  .rnd{width:26px;height:26px;border-radius:50%;background:#fffd;border:1.5px solid var(--ink);font-weight:900;font-size:14px;line-height:1;display:grid;place-items:center;padding:0}
  .rnd.back{background:#fff8;border-color:#fff;font-size:20px;margin-right:auto}
  .icons{display:flex;gap:6px;align-items:center}
  .icons .rnd{padding:0;border-radius:50%;width:26px;height:26px}
  .icons .pill{background:#fffe;border:1.5px solid var(--ink);border-radius:14px;padding:3px 8px;font-size:12px;font-weight:800;white-space:nowrap}
  .scene{position:absolute;inset:0;pointer-events:none}
  .moon{position:absolute;right:46px;top:40px;width:70px;height:70px;border-radius:50%;background:radial-gradient(#fffbe0,#ffe9a8 60%,#ffe9a800 72%);filter:blur(1px)}
  .web{position:absolute;left:4px;top:2px;font-size:40px;opacity:.7}
  .spider{position:absolute;left:62px;top:56px;font-size:20px}
  .castle{position:absolute;right:0;bottom:0;width:60%;height:70%}
  #title{position:relative;z-index:2;margin:10px 0 0;background:#fffa;border-radius:16px;padding:5px 12px;font-size:13px;font-weight:800;align-self:flex-start;max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rk-wrap{position:relative;z-index:2;margin-top:auto;display:flex;align-items:flex-end;gap:8px;padding-bottom:0}
  .rank2{position:relative;flex:0 0 76%;height:56px;margin-left:-8px;background:linear-gradient(90deg,#7a0a4c,#c01f6a);display:flex;align-items:center;color:#fff}
  .rk-title{position:absolute;left:10px;top:-32px;font-size:26px;font-weight:900;font-style:italic;color:var(--ink);-webkit-text-stroke:3px #fff;paint-order:stroke fill;text-shadow:2px 2px 0 var(--pink)}
  .rank2 .timer{position:absolute;left:150px;top:-22px;background:#6a0a40;border-radius:12px;padding:1px 9px 1px 6px;font-size:13px;font-weight:800;color:#fff}
  .rank2 .timer::before{content:"⏱ ";font-size:12px}
  .rank2 .rule{position:absolute;left:252px;top:-20px;background:#6a0a40;border-radius:9px;padding:1px 7px;font-size:10px;cursor:pointer;color:#fff}
  .rk-who{display:flex;flex-direction:column;align-items:center;padding:0 8px 0 12px;min-width:56px}
  .rk-who .av{width:30px;height:30px;font-size:17px}
  .rk-who .lv{font-size:10px;font-weight:700}
  .rk-cnt{flex:1;text-align:center;font-weight:900;font-size:14px;padding-right:46px}
  .rk-rw{position:absolute;right:-6px;top:-12px;display:flex;height:70px}
  .rk-lbl{width:28px;background:#ff5fa3;display:grid;place-items:center;font-size:13px;font-weight:900;text-align:center;line-height:1.1;margin-top:12px;height:58px}
  .rk-img{width:56px;height:70px;background:#ff6fb0;border:2px solid #8c0b52;display:grid;place-items:center;font-size:30px;position:relative}
  .rk-img span{position:absolute;left:-2px;right:-2px;bottom:-8px;background:#a86bb8;color:#fff;font-size:9px;font-weight:800;text-align:center;border-radius:6px;padding:1px 0}
  .rk-wrap .sold{position:static;margin:0 0 6px auto;color:var(--ink);background:#fffe;white-space:nowrap}
  .rail{height:10px;background:linear-gradient(#e9ecf1,#9aa1ac 55%,#d5d9e0)}
  .king{margin:0;border:0;border-radius:0;background:repeating-linear-gradient(0deg,#5ff0e6 0 3px,#43e3da 3px 6px);padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;box-shadow:inset 0 0 0 3px #7a838f}
  .king .kav{width:48px;height:48px;border-radius:50%;background:var(--gold);border:3px solid #fff;display:grid;place-items:center;font-size:26px}
  .kname{display:flex;flex-direction:column;line-height:1.1}
  .kname b{font-size:21px;font-weight:900;-webkit-text-stroke:2px #fff;paint-order:stroke fill;text-shadow:2px 2px 0 #0003}
  .kname span{font-size:11px;font-weight:700;color:#134}
  .kmid{text-align:right;line-height:1.2}
  .kmid .k1{font-size:16px;font-weight:900;color:#12303a}
  .kmid small{font-size:10px;color:#2a5560;font-weight:700}
  .kgo{width:26px;height:26px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-weight:900;background:#fff6}
  .tabs{background:#eceef3;margin-top:8px;padding:0;gap:0;border-radius:0}
  .tabs button{background:none;border-radius:20px 20px 0 0;padding:8px 18px;font-size:15px;font-weight:700;color:#667}
  .tabs button.on{background:#fff;color:var(--ink);font-size:20px;font-weight:900;box-shadow:0 -2px 0 var(--ink) inset}
  .tabs button.on::before{content:"✦ ";font-size:12px}
  .tabs button.on::after{content:" ✦";font-size:12px}
  .pity{margin:0;border-radius:0;background:repeating-linear-gradient(45deg,#8e8eff 0 14px,#9a9aff 14px 28px);color:var(--ink);font-weight:900;padding:6px;border-top:3px solid #fff}
  .pity span{font-size:15px}
  .pity b{font-style:normal;font-size:22px;color:var(--ink);background:none;padding:0 4px;-webkit-text-stroke:3px #fff;paint-order:stroke fill}
  .sec{margin:10px 8px 6px;background:#e4e4f1;border-radius:6px;padding:0 8px 0 0}
  .sec h3{background:none;font-size:24px;font-weight:900;-webkit-text-stroke:3px #fff;paint-order:stroke fill;text-shadow:2px 2px 0 var(--purple);padding:0 8px}
  .sec span{background:none;font-size:13px;font-weight:700}
  .grid{padding:0 8px;gap:8px}
  .it .img{border-radius:8px;background:#eeeef2}
  .it .nm{font-size:11px;margin-top:4px}
  .it .pr{font-size:12px}
  .dock{background:linear-gradient(#fff0,#e6e8ee 30%,#aab0ba);gap:8px}
  /* ---- 字體：內文用 Noto Sans TC，標題用 900 粗體加斜切 ---- */
  body,button,input{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
  .sec h3,.whead h3,.rk-title,.kname b,.tabs button.on{font-weight:900;font-style:normal;display:inline-block;transform:skewX(-8deg)}
  .whead h3{background:none;color:var(--ink);-webkit-text-stroke:3px #fff;paint-order:stroke fill;text-shadow:2px 2px 0 var(--purple);font-size:24px;padding:0 8px;border-radius:0}
  .whead h3.god{background:none}
  .whead{background:#e4e4f1;padding:0 8px 0 0}
  .wrow{grid-template-columns:40px auto minmax(0,1fr);gap:8px;padding:11px 10px}
  .wrow .av2{width:38px;height:38px;font-size:21px}
  .wtime{font-size:10.5px}
  .wbadge{background:#cfcfd6;color:var(--ink);font-weight:700}
  .wbadge.hot{background:#ffab40}
  .wit{font-size:12.5px;max-width:164px;justify-self:end;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
  .wname{font-weight:500;font-size:15px}
  .wit{font-weight:500}
  .wtime{font-weight:400}
  .ttl2{display:inline-block;font-style:normal;font-weight:900;font-size:23px;line-height:1.15;letter-spacing:1px;color:#fff;transform:skewX(-8deg);margin:2px 8px;-webkit-text-stroke:6px #1b1236;paint-order:stroke fill;text-shadow:3px 3px 0 #6b5cff;white-space:nowrap}
  .ttl2.god{text-shadow:3px 3px 0 #7b4dff}
  .ttl2.norm{text-shadow:3px 3px 0 #3d86ff}
  .ttl2.kt{font-size:22px;margin:0;-webkit-text-stroke:6px #0e2a33;text-shadow:2px 2px 0 #1fb8c8}
  .ttl{height:32px;width:auto;display:block;margin:2px 6px}
  .kname .ttl{height:30px;width:auto;margin:0;align-self:flex-start}
  .hero{overflow:visible}
  .scene{overflow:hidden}
  .rank2 .timer{left:140px}
  .rank2 .rule{left:228px;top:-19px}
  .rk-rw{right:-10px;top:-6px;height:64px}
  .rk-img{height:64px}
  .rk-lbl{margin-top:6px;height:58px}
  .rail:first-of-type{position:relative;z-index:1}
  .dock button{border:3px solid #cfd3da;box-shadow:0 2px 0 #7b828c,inset 0 2px 3px #fff4;font-size:17px}

  /* ---- 抽獎動畫（貨架 → 金屬門影片 → 超神款揭曉）與購買、結果畫面 ---- */
  .fx{position:fixed;inset:0;max-width:430px;margin:0 auto;z-index:30;background:#0b1020;overflow:hidden}
  .fx[hidden]{display:none}
  .fxskip,.skiptog{position:absolute;right:8px;top:12px;z-index:9;background:#ffffffd9;border:1.5px solid #222;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:800;color:#14152b;display:flex;gap:4px;align-items:center}
  .skiptog i{font-style:normal;display:grid;place-items:center;width:14px;height:14px;border-radius:50%;border:1.5px solid #222;font-size:10px;line-height:1}
  .stage{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .35s}
  .stage.on{opacity:1;pointer-events:auto}
  /* 貨架 */
  #stShelf{background:linear-gradient(#cdd3d6,#c6e0df 55%,#e4e9ea)}
  .sh-title{text-align:center;margin-top:58px;font-weight:900;font-size:26px;letter-spacing:3px;color:#111}
  .sh-title small{display:flex;align-items:center;gap:6px;justify-content:center;font-size:9px;letter-spacing:2px;font-weight:700;margin-top:0}
  .sh-title small::before,.sh-title small::after{content:"";width:64px;height:1px;background:#111}
  .sh-frame{position:absolute;left:13%;right:13%;top:136px;bottom:96px;border:3px solid #7a7a7a;border-top-width:7px;border-radius:2px;background:#f1f1f1;overflow:hidden;box-shadow:0 8px 18px #0004}
  .sh-cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);gap:0 3px;padding:0 3px;background:repeating-linear-gradient(0deg,#0000 0 58px,#cfcfcf 58px 60px)}
  .sh-col{overflow:hidden;position:relative}
  .sh-col .track{display:flex;flex-direction:column;gap:0;animation:scrollUp 6s linear infinite}
  .sh-col:nth-child(even) .track{animation-direction:reverse}
  @keyframes scrollUp{from{transform:translateY(0)}to{transform:translateY(-50%)}}
  .sh-col .t{aspect-ratio:1;display:grid;place-items:center;font-size:24px;overflow:hidden;border-bottom:2px solid #cfcfcf;background:#f6f6f6}
  .sh-col .t img{width:92%;height:92%;object-fit:contain;mix-blend-mode:multiply}
  .sh-center{position:absolute;left:28%;right:28%;top:0;bottom:0;border:3px solid #6b4de6;border-radius:6px;background:linear-gradient(#f7f4ff 55%,#d9cfff);display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:6px;padding:22px 6px;box-shadow:0 0 16px #6b4de688}

  try{ const s = JSON.parse((localStorage.getItem(KEY)||"null") && localStorage.getItem(KEY).split("$500 - 數位序號").join("$ 500 - 數位序號")); if(s && s.prizes && s.prizes.length){ const o = {...defaults(), ...s}; if(!s.godLog) o.godLog = (o.history||[]).filter(h=>h.god); if(s.wver !== 2){ o.prizes = invW(o.prizes); o.wver = 2; } return o; } }catch(e){}
  return defaults();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
// 另一個畫面（wallet.html）改錢包時，這裡即時同步點券／鑽石／優惠券
addEventListener("storage", e => { if(e.key !== KEY || !e.newValue) return; try{ const n = JSON.parse(e.newValue); S.coins = n.coins; S.gems = n.gems; S.coupons = n.coupons; render(); if($("mConfirm").classList.contains("show") && curN && typeof renderSheet === "function" && $("confirmBody").querySelector('[data-act="buy"]')) renderSheet(); }catch(err){} });

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = n => "NT$" + Number(n).toLocaleString("zh-TW");
function emoji(n){
  if(/iPhone|手機/.test(n) && !/MagSafe/.test(n)) return "📱";
  if(/Watch|手環|錶/.test(n)) return "⌚";
  if(/Mac/.test(n)) return "💻";
  if(/AirPods|Bose|耳機/.test(n)) return "🎧";
  if(/眼鏡/.test(n)) return "🕶️";
  if(/電池|行動電源|MagSafe/.test(n)) return "🔋";
  if(/充電|轉接/.test(n)) return "🔌";
  if(/Gift|卡/.test(n) && !/卡牌/.test(n)) return "🎁";
  return "🃏";
}

// 商品圖：優先用設定頁上傳的圖，其次 images/<價值>.png|jpg|webp（基本款為 images/normal.*），都沒有就用圖示
function pic(name, value, normal){
  const p = normal ? null : S.prizes.find(x => x.value === value);
  const up = normal ? S.normImg : p && p.img;
  if(up) return `<img src="${up}" alt="">`;
  const k = normal ? "normal" : value;
  if(EMBED[k]) return `<img src="${EMBED[k]}" alt="">`;
  return `<img src="images/${k}.png" alt="" data-k="${k}" data-t="0" data-fb="${emoji(name)}" onerror="imgErr(this)">`;
}
function imgErr(el){
  const exts = ["jpg","webp","jpeg"], t = +el.dataset.t;
  if(t < exts.length){ el.dataset.t = t + 1; el.src = `images/${el.dataset.k}.${exts[t]}`; }
  else el.replaceWith(document.createTextNode(el.dataset.fb));
}
function shrink(file, cb){
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const s = Math.min(1, 240 / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    cb(c.toDataURL("image/webp", .85));
  };
  img.src = url;
}

// ---- 抽獎核心 ----
function rand(){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; }
const wt = p => Math.max(0, +p.weight || 0);
function pickPrize(){
  const t = S.prizes.reduce((s,p)=>s+wt(p), 0);
  if(t <= 0) return S.prizes[Math.floor(rand()*S.prizes.length)];
  let r = rand()*t;
  for(const p of S.prizes){ r -= wt(p); if(r < 0) return p; }
  return S.prizes[S.prizes.length-1];
}
function drawOnce(){
  S.sold++; S.spent += S.price;
  const forced = S.pity + 1 >= S.pityMax;
  let r;
  if(forced || rand() < S.godRate/100){
    const p = pickPrize();
    const at = S.pity + 1; // 這次是第幾抽中的（距上一次超神款）
    S.pity = 0; S.counts++; S.topBy = S.sold;
    S.king = {n:S.sold, name:"你"};
    r = {god:true, pity:forced, name:p.name, value:p.value, at};
  }else{
    S.pity++;
    r = {god:false, name:S.normName, value:S.normValue};
  }
  S.won += r.value;
  const k = (r.god?"G|":"N|") + r.name + "|" + r.value;
  S.inv[k] = S.inv[k] || {god:r.god, name:r.name, value:r.value, n:0};
  S.inv[k].n++;
  const rec = {...r, no:S.sold, t:Date.now()};
  S.history.push(rec);
  if(S.history.length > 300) S.history.shift();
  if(r.god){ S.godLog.push(rec); if(S.godLog.length > 50) S.godLog.shift(); }
  return r;
}

// ---- 渲染 ----
function renderGrid(el, items, goldSet){
  el.innerHTML = items.map(p => `<div class="it ${S.inv["G|"+p.name+"|"+p.value]?"got":""}" data-v="${p.value}" data-normal="${p.normal?1:0}"><div class="img">${pic(p.name, p.value, p.normal)}</div><div class="nm" title="${esc(p.name)}">${esc(p.name)}</div><div class="pr">${money(p.value)}</div></div>`).join("");
}
function render(){
  $("title").textContent = S.prizes.length ? `${S.prizes[titleIdx % S.prizes.length].name}（隨機出貨）` : "";
  $("sold").textContent = "已售出：" + S.sold.toLocaleString();
  $("rkRw").textContent = money(S.reward);
  $("rkName").textContent = S.counts ? "你" : "虛位以待";
  $("rkAv").textContent = S.counts ? "😎" : "👑";
  $("rkCnt").textContent = "超神次數 " + S.counts;
  const k = S.king;
  $("king").innerHTML = `<div class="kav">${k?"😎":"👑"}</div>
    <div class="kname"><em class="ttl2 kt">大魔王</em><span>${k?"你・超神款館皇":"暫無"}</span></div>
    <div class="kmid"><div class="k1">已占領${k ? S.sold - k.n : 0}發</div><small>${k ? `第${k.n}發晉升館皇` : `已售出${S.sold}發`}</small></div>
    <div class="kgo"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 5l7 7-7 7"/></svg></div>`;
  const left = Math.max(0, S.pityMax - S.pity);
  $("pityTxt").innerHTML = `再抽 <b>${left}</b> 次必中超神款`;
  $("pityBar").style.width = Math.min(100, S.pity/S.pityMax*100) + "%";
  $("godRateTxt").textContent = "概率：" + +S.godRate.toFixed(4) + "%";
  $("normRateTxt").textContent = "概率：" + +(100 - S.godRate).toFixed(4) + "%";
  renderGrid($("godGrid"), [...S.prizes].sort((a,b)=>b.value-a.value));
  renderGrid($("normGrid"), [{name:S.normName, value:S.normValue, normal:true}]);
  $("dock").innerHTML = [1,3,5,12].map(n => `<button data-n="${n}" ${busy?"disabled":""}>抽${n}發<small>${money(S.price*n)}</small></button>`).join("");
  renderWinners();
}
const open = {god:false, norm:false};
const pad = n => String(n).padStart(2, "0");
const fmtT = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
function renderWinners(){
  const block = (key, title, god) => {
    const list = (god ? S.godLog : S.history.filter(h => !h.god)).slice().reverse();
    const shown = open[key] ? list.slice(0, 10) : list.slice(0, 1);

function tick(){

    S.rankLog.unshift({t:S.periodEnd, counts:S.counts, reward:S.reward});

    S.counts = 0; S.periodEnd = Date.now() + PERIOD; save(); render(); ms = PERIOD;
  }

let fxAbort = false, fxWaiters = [];
function fxSleep(ms){
  return new Promise(res => {
    if(fxAbort) return res();
    const done = () => { clearTimeout(id); fxWaiters = fxWaiters.filter(f => f !== done); res(); };
    const id = setTimeout(done, ms);
    fxWaiters.push(done);
  });
}
function fxSetStage(id){ document.querySelectorAll("#fx .stage").forEach(s => s.classList.toggle("on", s.id === id)); }

// 金屬門影片（內嵌在頁面最後面的 #vaultdata）
let vaultUrl = null;
function loadVault(){
  if(vaultUrl) return vaultUrl;
  const el = document.getElementById("vaultdata");
  if(!el) return null;
  try{
    const bin = atob(el.textContent.trim());
    const u8 = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    vaultUrl = URL.createObjectURL(new Blob([u8], {type:"video/mp4"}));
    $("vaultV").src = vaultUrl;
  }catch(e){ vaultUrl = null; }
  return vaultUrl;
}
const VAULT_IN = 14.95, VAULT_MS = 6000;

// 貨架（對照影片量測）：整面貨架 6 排同方向（向左）同步高速滾動，停頓約 0.6 秒後起跑、初速最快、等減速（easeOutQuad）約 2.9 秒停下，
// 每格 = 一排寬度的 1/4（一格一件商品），共滾過 14 格；滾動時整面是水平動態模糊；停下時中間紫框 2 格就是這排的兩件獎品
const SH_ROWS = 6, SH_CELLS = 18, SH_MOVE = 14, SH_HOLD0 = 600, SH_DUR = 2900, SH_HOLD1 = 1800;
function buildShelf(res){
  const item = () => { if(Math.random() < .22) return `<div class="sl"><div class="it2 card">${pic(S.prizes[0].name, S.prizes[0].value, true)}</div></div>`;
    const p = S.prizes[Math.floor(Math.random() * S.prizes.length)]; return `<div class="sl"><div class="it2">${pic(p.name, p.value, false)}</div></div>`; };
  const card = r => `<div class="sl"><div class="it2 card ${r.god ? "god" : ""}">${pic(r.name, r.value, !r.god)}</div></div>`;
  const blank = () => `<div class="sl"><div class="it2 card">${pic(S.prizes[0].name, S.prizes[0].value, false)}</div></div>`;
  let rows = "";
  for(let r = 0; r < SH_ROWS; r++){
    const a = res[r * 2], b = res[r * 2 + 1];
    let cells = "";
    for(let c = 0; c < SH_CELLS; c++) cells += c === SH_MOVE + 1 ? (a ? card(a) : blank()) : c === SH_MOVE + 2 ? (b ? card(b) : blank()) : item();
    rows += `<div class="shr"><div class="sh-strip" style="width:${SH_CELLS * 25}%">${cells}</div></div>`;
  }
  $("stShelf").innerHTML = `<svg width="0" height="0" style="position:absolute"><filter id="hb" x="-5%" y="0" width="110%" height="100%"><feGaussianBlur id="hbn" stdDeviation="0 0"/></filter></svg>
    <div class="sh-title">無限賞<small>INFINITE KUJI</small></div>
    <div class="sh-frame"><div class="sh-rows">${rows}</div>
    <div class="sh-win"><span class="rcv top">RECEIVE</span><span class="rcv bot">RECEIVE</span></div></div>`;
}
async function playShelf(res){
  buildShelf(res);
  fxSetStage("stShelf");
  const strips = [...document.querySelectorAll("#stShelf .sh-strip")], rowsEl = document.querySelector("#stShelf .sh-rows"), hbn = $("hbn");
  const to = -SH_MOVE / SH_CELLS * 100;
  await fxSleep(SH_HOLD0);
  if(fxAbort) return;
  strips.forEach(s => s.animate([{transform: "translateX(0)"}, {transform: `translateX(${to}%)`}],
    {duration: SH_DUR, easing: "cubic-bezier(.5,1,.89,1)", fill: "both"}));
  rowsEl.style.filter = "url(#hb)";
  const t0 = performance.now();
  await new Promise(done => {
    const tick = now => {
      const t = Math.min(1, (now - t0) / SH_DUR);
      hbn.setAttribute("stdDeviation", (2.5 * (1 - t) * (1 - t)).toFixed(2) + " 0");   // 速度越快越模糊
      if(t < 1 && !fxAbort) requestAnimationFrame(tick); else done();
    };
    requestAnimationFrame(tick);
  });
  rowsEl.style.filter = "";
  await fxSleep(SH_HOLD1);
}
async function playVault(){
  const url = loadVault();
  if(!url) return;
  const v = $("vaultV");
  if(v.readyState < 1) await new Promise(r => { v.onloadedmetadata = r; setTimeout(r, 2500); });
  if(v.readyState < 1) return;
  v.currentTime = VAULT_IN;
  await new Promise(r => { v.onseeked = r; setTimeout(r, 1500); });
  fxSetStage("stVault");
  try{ await v.play(); }catch(e){ return; }
  await fxSleep(VAULT_MS);
  v.pause();
}
function countUp(el, to){
  const t0 = performance.now(), dur = 700;
  const step = now => { const k = Math.min(1, (now - t0) / dur); el.textContent = Math.round(to * k); if(k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
async function playReveal(gods){
  for(let i = 0; i < gods.length; i++){
    if(fxAbort) return;
    const r = gods[i], last = i === gods.length - 1;
    $("stReveal").innerHTML = `<div class="rv-title">恭喜獲得</div>

      const h = e => { const b = e.target.closest("[data-rv]"); if(!b) return; $("stReveal").removeEventListener("click", h); fxWaiters = fxWaiters.filter(f => f !== abortH); res(b.dataset.rv); };
      const abortH = () => { $("stReveal").removeEventListener("click", h); res("skip"); };

async function playFx(res){
  fxAbort = false;

  try{
    await playShelf(res);
    const gods = res.filter(r => r.god).sort((a, b) => b.value - a.value);
    if(gods.length && !fxAbort){
      await playVault();

    try{ $("vaultV").pause(); }catch(e){}
    $("fx").hidden = true;
    document.querySelectorAll("#fx .stage").forEach(s => s.classList.remove("on"));
    fxAbort = false; fxWaiters = [];
  }
}

const payOpt = {coupon:true, coins:true, gems:true, agree:true};
let curN = 1, curPlan = null;
function calcPlan(n){
  const total = S.price * n;
  let rest = total;
  const p = {n, total, coupon:0, coins:0, gems:0};
  if(payOpt.coupon && S.coupons > 0 && total >= 50){ p.coupon = Math.min(15, rest); rest -= p.coupon; }
  if(payOpt.coins){ p.coins = Math.min(S.coins, rest); rest -= p.coins; }
  if(payOpt.gems){ p.gems = Math.min(S.gems, rest); rest -= p.gems; }
  p.pay = rest;
  return p;
}
function applyPlan(p){
  if(p.coupon) S.coupons--;
  S.coins -= p.coins; S.gems -= p.gems;
  S.points += p.pay; S.paid += p.pay; S.lastPts = p.pay;
}

    <div class="row">獎項由高到低依機率型抽獎公開；每次購買會隨機獲得一個賞品，購買後立即開獎，標示的機率為該等級內所有賞品的綜合機率，不代表單一賞品的機率。</div>`;
  show("mKing");
}
$("bCabinet").onclick = () => {
  const items = Object.values(S.inv).sort((a,b)=>b.god-a.god || b.value-a.value);
  $("cabBody").innerHTML = items.length
    ? `<div class="rgrid">${items.map(r=>`<div class="rc ${r.god?"god":""}"><div class="e">${pic(r.name, r.value, !r.god)}</div><div>${esc(r.name)}</div><b>×${r.n}</b><div>${money(r.value)}</div></div>`).join("")}</div>`
    : '<div class="muted" style="text-align:center;padding:30px">賞櫃還是空的</div>';
  show("mCab");
};

// ---- 設定 ----
function openSettings(){
  $("sGod").value = S.godRate; $("sPity").value = S.pityMax; $("sPrice").value = S.price; $("sReward").value = S.reward;
  $("sNormName").value = S.normName; $("sNormVal").value = S.normValue;
  $("sCoins").value = S.coins; $("sGems").value = S.gems; $("sCoupons").value = S.coupons;
  $("sPrizes").innerHTML = S.prizes.map((p,i)=>`<tr><td><input data-i="${i}" data-k="name" value="${esc(p.name)}"></td><td><input type="number" min="0" data-i="${i}" data-k="value" value="${p.value}"></td><td><input type="number" min="0" step="any" data-i="${i}" data-k="weight" value="${p.weight}"></td><td><input type="file" accept="image/*" data-img="${i}" style="width:90px"></td></tr>`).join("");
  $("mRules").classList.remove("show"); show("mSet");
}
$("bSettings").onclick = openSettings;
const num = (id, lo, hi) => Math.min(hi, Math.max(lo, +$(id).value || 0));
[["sGod",()=>S.godRate=num("sGod",0,100)],["sPity",()=>S.pityMax=Math.max(1,Math.floor(num("sPity",1,1e9)))],
 ["sCoins",()=>S.coins=Math.floor(num("sCoins",0,1e9))],["sGems",()=>S.gems=Math.floor(num("sGems",0,1e9))],["sCoupons",()=>S.coupons=Math.floor(num("sCoupons",0,1e6))],
 ["sPrice",()=>S.price=num("sPrice",0,1e9)],["sReward",()=>S.reward=num("sReward",0,1e9)],
 ["sNormName",()=>S.normName=$("sNormName").value||"基本款"],["sNormVal",()=>S.normValue=num("sNormVal",0,1e9)]]
  .forEach(([id,fn]) => $(id).onchange = () => { fn(); save(); render(); });
$("sNormImg").onchange = e => { const f = e.target.files[0]; if(f) shrink(f, d => { S.normImg = d; save(); render(); }); };
$("sPrizes").addEventListener("change", e => {
  const el = e.target, i = el.dataset.i;
  if(el.dataset.img !== undefined){
    const f = el.files[0]; if(f) shrink(f, d => { S.prizes[el.dataset.img].img = d; save(); render(); });
    return;
  }
  if(i === undefined) return;
  S.prizes[i][el.dataset.k] = el.dataset.k === "name" ? el.value : Math.max(0, +el.value || 0);
  save(); render();
});
$("sRecalc").onclick = () => { S.prizes = invW(S.prizes); save(); render(); openSettings(); };
$("sReset").onclick = () => { if(confirm("還原預設獎池與規則？（紀錄保留）")){ const d = defaults(); const keep = {pity:S.pity,sold:S.sold,spent:S.spent,won:S.won,bonus:S.bonus,king:S.king,inv:S.inv,history:S.history,counts:S.counts,periodEnd:S.periodEnd}; S = {...d, ...keep}; save(); render(); openSettings(); } };
$("sClear").onclick = () => { if(confirm("清除所有抽獎紀錄、保底與榜首進度？")){ const d = defaults(); S = {...d, godRate:S.godRate, pityMax:S.pityMax, price:S.price, reward:S.reward, normName:S.normName, normValue:S.normValue, prizes:S.prizes}; save(); render(); } };

$("bFav").innerHTML = S.fav ? FAV_ON : FAV_OFF; $("bMusic").style.opacity = S.mute ? .4 : 1;
render(); tick(); setInterval(tick, 1000);
setInterval(() => { if(!busy){ titleIdx++; $("title").style.opacity = 0; setTimeout(()=>{ render(); $("title").style.opacity = 1; }, 250); } }, 4000);
</script>
<script>if("serviceWorker" in navigator && location.protocol.startsWith("http")) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
